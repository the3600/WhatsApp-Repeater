name: Security & Secret Scanning

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Scanning (Gitleaks & Sensitive Files)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check forbidden tracked filenames
        run: |
          set -euo pipefail
          FORBIDDEN=$(git ls-files | grep -E '\.(jks|keystore|p12|pfx|pem|key|db|sqlite|sqlite3|env|wrbackup|apk|aab)$|keystore\.properties|signing\.properties|local\.properties' || true)
          if [ -n "$FORBIDDEN" ]; then
            echo "::error::Se detectaron archivos sensibles rastreados en Git:"
            echo "$FORBIDDEN"
            exit 1
          fi
          echo "OK: Ningún keystore, credencial, base de datos ni APK rastreado en Git."

      - name: Run Gitleaks secret scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  static-analysis:
    name: Android Lint & Static Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: Run Android Lint
        run: ./gradlew lintDebug --no-daemon

  codeql:
    name: CodeQL Analysis (Kotlin / Java)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Build JVM & Android debug classes for CodeQL
        run: |
          chmod +x ./gradlew
          ./gradlew compileDebugKotlin testClasses --no-daemon

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java-kotlin"
