name: Android CI & Signed Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      publish_debug_prerelease:
        description: 'Publicar versión preliminar Debug en GitHub Releases (Pre-release)'
        required: false
        default: false
        type: boolean
      prerelease_tag:
        description: 'Etiqueta para la versión preliminar Debug'
        required: false
        default: 'v1.0.0'
        type: string
      build_release:
        description: 'Compilar APK Release firmado (solo si los 4 Secrets están configurados)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  test-and-debug:
    name: Pruebas, migraciones y APK Debug
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          token: ${{ github.token }}
          persist-credentials: false

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Dar permisos a Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Configurar keystore Debug consistente (si está configurado)
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$DEBUG_KEYSTORE_B64" | tr -d '\r\n ' | base64 --decode > "$HOME/.android/debug.keystore"
            echo "Usando debug.keystore persistente desde Secret ANDROID_DEBUG_KEYSTORE_BASE64."
          else
            echo "::warning::ANDROID_DEBUG_KEYSTORE_BASE64 no está configurado; Gradle generará un debug.keystore efímero distinto al del equipo local."
          fi

      - name: Ejecutar pruebas unitarias y de migración Room
        run: ./gradlew testDebugUnitTest test

      - name: Compilar APK de depuración (verificación CI)
        run: ./gradlew assembleDebug

      - name: Verificar identidad fija de aplicación en APK Debug
        run: |
          set -euo pipefail
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name "aapt2" | sort -V | tail -n 1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name "apksigner" | sort -V | tail -n 1)
          BADGING_FILE=$(mktemp)
          "$AAPT2" dump badging app/build/outputs/apk/debug/app-debug.apk > "$BADGING_FILE"
          head -n 5 "$BADGING_FILE"
          grep -q "package: name='com.whatsapprepeater.android'" "$BADGING_FILE"
          rm -f "$BADGING_FILE"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk

      - name: Prueba de regresión del extractor SHA-256 de apksigner
        run: |
          set -euo pipefail
          EXPECTED_CERT_SHA256="0e582e7eec8712c582f7a48f1ad1d473e2ba149f4ed997914574a4daeb13c109"
          extract_cert_sha256() {
            local file="$1"
            local line
            line=$(grep -i -m 1 'V2 Signer:.*certificate SHA-256 digest:' "$file" || grep -i -m 1 'certificate SHA-256 digest:' "$file" || true)
            printf '%s\n' "$line" \
              | sed -E 's/.*certificate SHA-256 digest:[[:space:]]*//I' \
              | tr -d ':\r\n[:space:]' \
              | tr '[:upper:]' '[:lower:]' \
              | grep -Eo '^[0-9a-f]{64}$' || true
          }

          SAMPLE_V2=$(mktemp)
          printf '%s\n' \
            'Verifies' \
            'Verified using v1 scheme (JAR signing): false' \
            'Verified using v2 scheme (APK Signature Scheme v2): true' \
            'Number of signers: 1' \
            'V2 Signer: certificate DN: CN=WhatsApp Repeater' \
            'V2 Signer: certificate SHA-256 digest: 0e582e7eec8712c582f7a48f1ad1d473e2ba149f4ed997914574a4daeb13c109' \
            > "$SAMPLE_V2"
          GOT_V2=$(extract_cert_sha256 "$SAMPLE_V2")
          rm -f "$SAMPLE_V2"
          [ "${#GOT_V2}" -eq 64 ] && [ "$GOT_V2" = "$EXPECTED_CERT_SHA256" ]

          SAMPLE_COLON=$(mktemp)
          printf 'Signer #1 certificate SHA-256 digest: 0E:58:2E:7E:EC:87:12:C5:82:F7:A4:8F:1A:D1:D4:73:E2:BA:14:9F:4E:D9:97:91:45:74:A4:DA:EB:13:C1:09\n' > "$SAMPLE_COLON"
          GOT_COLON=$(extract_cert_sha256 "$SAMPLE_COLON")
          rm -f "$SAMPLE_COLON"
          [ "${#GOT_COLON}" -eq 64 ] && [ "$GOT_COLON" = "$EXPECTED_CERT_SHA256" ]
          echo "Regresión apksigner SHA-256 OK: $GOT_V2"

      - name: Preparar APK Debug descargable con nombre reconocible
        run: |
          mkdir -p dist-debug
          cp app/build/outputs/apk/debug/app-debug.apk dist-debug/WhatsApp-Repeater-Android.apk
          ls -lh dist-debug/WhatsApp-Repeater-Android.apk

      - name: Subir APK Debug como Artifact descargable
        uses: actions/upload-artifact@v7
        with:
          name: WhatsApp-Repeater-Android
          path: dist-debug/WhatsApp-Repeater-Android.apk
          if-no-files-found: error

  publish-debug-prerelease:
    name: Publicar Pre-release preliminar Debug en Releases
    needs: test-and-debug
    if: github.event_name == 'workflow_dispatch' && inputs.publish_debug_prerelease == true && inputs.build_release != true
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          token: ${{ github.token }}
          persist-credentials: false

      - name: Descargar Artifact APK Debug verificado
        uses: actions/download-artifact@v4
        with:
          name: WhatsApp-Repeater-Android
          path: dist-debug

      - name: Generar SHA-256 y notas en español (firma Debug)
        id: meta
        run: |
          set -euo pipefail
          source version.properties
          APK_FILE="dist-debug/WhatsApp-Repeater-Android.apk"
          test -s "$APK_FILE"
          SHA256=$(sha256sum "$APK_FILE" | awk '{print $1}')
          echo "$SHA256  WhatsApp-Repeater-Android.apk" > "${APK_FILE}.sha256"

          cat > dist-debug/release-notes-debug.md <<EOF
          > ⚠️ **Versión preliminar de pruebas (firma Debug)**
          > Este APK está firmado con **clave Debug** únicamente para pruebas funcionales e instalación directa en dispositivos autorizados. **No es un Release definitivo de producción.**

          ### Detalles del paquete
          - **Aplicación:** WhatsApp Repeater
          - **Application ID:** \`com.whatsapprepeater.android\`
          - **Versión:** \`${VERSION_NAME}\` (\`versionCode=${VERSION_CODE}\`)
          - **Archivo APK:** \`WhatsApp-Repeater-Android.apk\`
          - **SHA-256:** \`${SHA256}\`

          ### Instalación en Android
          1. Descarga \`WhatsApp-Repeater-Android.apk\` desde los archivos adjuntos (**Assets**) de este lanzamiento.
          2. Ábrelo desde **Descargas / Archivos** y autoriza **Instalar aplicaciones desconocidas** si Android lo solicita.
          3. En Android 13+, si el Servicio de Accesibilidad aparece restringido, entra a **Ajustes → Aplicaciones → WhatsApp Repeater → menú \`⋮\` → Permitir ajustes restringidos**.

          > **Nota importante sobre actualizaciones futuras:** Al migrar por primera vez de esta compilación **Debug** a la versión **Release definitiva firmada con tu keystore de producción**, Android requerirá desinstalar la versión Debug una única vez. A partir del primer Release firmado de producción, todas las actualizaciones conservarán automáticamente tus datos.
          EOF

          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"

      - name: Publicar Pre-release Debug en GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.prerelease_tag || 'v1.0.0' }}
          name: "WhatsApp Repeater ${{ steps.meta.outputs.version_name }} – Versión de pruebas Debug"
          prerelease: true
          draft: false
          target_commitish: ${{ github.sha }}
          body_path: dist-debug/release-notes-debug.md
          files: |
            dist-debug/WhatsApp-Repeater-Android.apk
            dist-debug/WhatsApp-Repeater-Android.apk.sha256

  release-signed:
    name: Firmar APK de producción y publicar Release
    needs: test-and-debug
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) ||
      (github.event_name == 'workflow_dispatch' && inputs.build_release == true)
    runs-on: ubuntu-latest
    concurrency:
      group: android-release-publish
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          token: ${{ github.token }}
          persist-credentials: false

      - name: Determinar versión automática y evitar publicaciones duplicadas
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BASE_CODE=$(grep '^VERSION_CODE=' version.properties | tr -d '\r' | cut -d'=' -f2)
          BASE_NAME=$(grep '^VERSION_NAME=' version.properties | tr -d '\r' | cut -d'=' -f2)

          RELEASES_JSON=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/releases?per_page=100" || echo "[]")
          TAGS_JSON=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/tags?per_page=100" || echo "[]")

          # Evitar duplicados si este commit ya generó un Release firmado válido (ej. reintentos o dispatch repetido)
          if [[ "${{ github.ref }}" != refs/tags/v* ]]; then
            EXISTING_TAG=$(printf '%s' "$RELEASES_JSON" | jq -r --arg sha "${{ github.sha }}" '
              map(select(.draft == false and .target_commitish == $sha))
              | map(select((.assets | any(.name | endswith(".apk"))) and (.assets | any(.name == "version-metadata.json"))))
              | .[0].tag_name // empty
            ' 2>/dev/null || true)
            if [ -n "$EXISTING_TAG" ]; then
              echo "Ya existe una publicación firmada verificada ($EXISTING_TAG) para el commit ${{ github.sha }}. Se omite duplicado."
              echo "should_publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          ALL_TAGS=$(printf '%s\n%s\n' \
            "$(printf '%s' "$TAGS_JSON" | jq -r '.[].name // empty' 2>/dev/null || true)" \
            "$(printf '%s' "$RELEASES_JSON" | jq -r '.[].tag_name // empty' 2>/dev/null || true)")

          MAX_TAG_CODE=$(printf '%s\n' "$ALL_TAGS" | sed -nE 's/.*-build\.([0-9]+)$/\1/p' | sort -n | tail -n 1 || echo "0")
          if [ -z "$MAX_TAG_CODE" ]; then MAX_TAG_CODE=0; fi

          PREV_META_URL=$(printf '%s' "$RELEASES_JSON" | jq -r '
            map(select(.draft == false))
            | map(select(.assets | any(.name == "version-metadata.json")))
            | .[0].assets[]? | select(.name == "version-metadata.json") | .url // empty
          ' 2>/dev/null | head -n 1 || true)

          PREV_META_CODE=0
          PREV_CERT=""
          if [ -n "$PREV_META_URL" ]; then
            PREV_META_JSON=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/octet-stream" "$PREV_META_URL" || true)
            if [ -n "$PREV_META_JSON" ]; then
              PREV_META_CODE=$(printf '%s' "$PREV_META_JSON" | jq -r '.versionCode // 0' 2>/dev/null || echo "0")
              PREV_CERT=$(printf '%s' "$PREV_META_JSON" | jq -r '.signingCertSha256 // empty' 2>/dev/null | tr -d ':\r\n[:space:]' | tr '[:upper:]' '[:lower:]' || true)
            fi
          fi

          PREV_MAX_CODE="$MAX_TAG_CODE"
          if [ "$PREV_META_CODE" -gt "$PREV_MAX_CODE" ]; then
            PREV_MAX_CODE="$PREV_META_CODE"
          fi

          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TARGET_CODE="$BASE_CODE"
            TARGET_NAME="$BASE_NAME"
            RELEASE_TAG="${{ github.ref_name }}"
            IS_PRERELEASE="false"
            if [ "$TARGET_CODE" -le "$PREV_MAX_CODE" ]; then
              echo "::error::El versionCode actual en version.properties ($TARGET_CODE) debe ser mayor que el publicado anteriormente ($PREV_MAX_CODE)."
              exit 1
            fi
          else
            TARGET_CODE=$((PREV_MAX_CODE + 1))
            if [ "$TARGET_CODE" -lt "$BASE_CODE" ]; then
              TARGET_CODE="$BASE_CODE"
            fi
            while printf '%s\n' "$ALL_TAGS" | grep -Fxq "v${BASE_NAME}-build.${TARGET_CODE}"; do
              TARGET_CODE=$((TARGET_CODE + 1))
            done
            TARGET_NAME="${BASE_NAME}-build.${TARGET_CODE}"
            RELEASE_TAG="v${TARGET_NAME}"
            IS_PRERELEASE="true"
          fi

          echo "Versión calculada: versionName=$TARGET_NAME, versionCode=$TARGET_CODE, tag=$RELEASE_TAG, prerelease=$IS_PRERELEASE (prevMaxCode=$PREV_MAX_CODE)"
          echo "should_publish=true" >> "$GITHUB_OUTPUT"
          echo "version_code=$TARGET_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$TARGET_NAME" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "prev_max_code=$PREV_MAX_CODE" >> "$GITHUB_OUTPUT"
          echo "prev_cert=$PREV_CERT" >> "$GITHUB_OUTPUT"

      - name: Configurar JDK 17
        if: steps.ver.outputs.should_publish == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle
        if: steps.ver.outputs.should_publish == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Validar existencia de GitHub Secrets de firma
        if: steps.ver.outputs.should_publish == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "::error::Faltan secretos de firma de producción (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD). No se permite publicar con clave debug."
            exit 1
          fi

      - name: Decodificar keystore temporal de producción
        if: steps.ver.outputs.should_publish == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | tr -d '\r\n ' | base64 --decode > /tmp/release-keystore.jks
          if [ ! -s /tmp/release-keystore.jks ]; then
            echo "::error::El keystore decodificado está vacío o corrupto."
            exit 1
          fi

      - name: Compilar y firmar APK de producción
        if: steps.ver.outputs.should_publish == 'true'
        env:
          ANDROID_VERSION_CODE: ${{ steps.ver.outputs.version_code }}
          ANDROID_VERSION_NAME: ${{ steps.ver.outputs.version_name }}
          ANDROID_KEYSTORE_PATH: /tmp/release-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-configuration-cache

      - name: Eliminar keystore temporal del runner
        if: always()
        run: rm -f /tmp/release-keystore.jks

      - name: Verificar compatibilidad de actualización, firma y generar SHA-256
        id: verify
        if: steps.ver.outputs.should_publish == 'true'
        run: |
          set -euo pipefail
          VERSION_CODE="${{ steps.ver.outputs.version_code }}"
          VERSION_NAME="${{ steps.ver.outputs.version_name }}"
          PREV_CERT="${{ steps.ver.outputs.prev_cert }}"

          APK_SRC="app/build/outputs/apk/release/app-release.apk"
          if [ ! -s "$APK_SRC" ]; then
            echo "::error::No se encontró la APK Release esperada en $APK_SRC."
            exit 1
          fi

          OUT_DIR="dist"
          rm -rf "$OUT_DIR"
          mkdir -p "$OUT_DIR"
          APK_NAME="WhatsAppRepeater-v${VERSION_NAME}-release.apk"
          cp "$APK_SRC" "$OUT_DIR/$APK_NAME"

          AAPT2=$(find "$ANDROID_HOME/build-tools" -name "aapt2" | sort -V | tail -n 1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name "apksigner" | sort -V | tail -n 1)

          BADGING_FILE=$(mktemp)
          "$AAPT2" dump badging "$OUT_DIR/$APK_NAME" > "$BADGING_FILE"
          head -n 5 "$BADGING_FILE"
          grep -q "package: name='com.whatsapprepeater.android'" "$BADGING_FILE"
          grep -q "versionCode='${VERSION_CODE}'" "$BADGING_FILE"
          grep -q "versionName='${VERSION_NAME}'" "$BADGING_FILE"
          rm -f "$BADGING_FILE"

          APKSIGNER_FILE=$(mktemp)
          "$APKSIGNER" verify --verbose --print-certs "$OUT_DIR/$APK_NAME" > "$APKSIGNER_FILE"
          cat "$APKSIGNER_FILE"

          CERT_LINE=$(grep -i -m 1 'V2 Signer:.*certificate SHA-256 digest:' "$APKSIGNER_FILE" || grep -i -m 1 'certificate SHA-256 digest:' "$APKSIGNER_FILE" || true)
          CERT_SHA256=$(printf '%s\n' "$CERT_LINE" \
            | sed -E 's/.*certificate SHA-256 digest:[[:space:]]*//I' \
            | tr -d ':\r\n[:space:]' \
            | tr '[:upper:]' '[:lower:]' \
            | grep -Eo '^[0-9a-f]{64}$' || true)
          rm -f "$APKSIGNER_FILE"

          if [ -z "$CERT_SHA256" ] || ! printf '%s\n' "$CERT_SHA256" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "::error::No se pudo extraer una huella SHA-256 válida de 64 caracteres hexadecimales desde apksigner (obtenido: '$CERT_SHA256')."
            exit 1
          fi

          EXPECTED_CERT_SHA256="0e582e7eec8712c582f7a48f1ad1d473e2ba149f4ed997914574a4daeb13c109"
          if [ "$CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::El certificado de firma SHA-256 obtenido ($CERT_SHA256) no coincide con el keystore permanente esperado ($EXPECTED_CERT_SHA256)."
            exit 1
          fi
          if [ -n "$PREV_CERT" ] && [ "$CERT_SHA256" != "$PREV_CERT" ]; then
            echo "::error::El certificado actual ($CERT_SHA256) no coincide con el Release previo ($PREV_CERT). Rompería futuras actualizaciones."
            exit 1
          fi
          echo "Certificado permanente verificado (SHA-256, 64 hex): $CERT_SHA256"

          SHA256=$(sha256sum "$OUT_DIR/$APK_NAME" | awk '{print $1}')
          echo "$SHA256  $APK_NAME" > "$OUT_DIR/$APK_NAME.sha256"
          (cd "$OUT_DIR" && sha256sum -c "$APK_NAME.sha256")

          jq -n \
            --arg appId "com.whatsapprepeater.android" \
            --argjson versionCode "${VERSION_CODE}" \
            --arg versionName "${VERSION_NAME}" \
            --argjson minSdk 28 \
            --arg sha256 "${SHA256}" \
            --arg certSha256 "${CERT_SHA256}" \
            '{
              applicationId: $appId,
              versionCode: $versionCode,
              versionName: $versionName,
              minSdk: $minSdk,
              sha256: $sha256,
              signingCertSha256: $certSha256
            }' > "$OUT_DIR/version-metadata.json"

          jq -e '.applicationId == "com.whatsapprepeater.android" and .versionCode > 0 and (.sha256 | length == 64) and (.signingCertSha256 | length == 64)' "$OUT_DIR/version-metadata.json" > /dev/null
          cat "$OUT_DIR/version-metadata.json"

          printf '%s\n' \
            "### WhatsApp Repeater \`v${VERSION_NAME}\` (Release firmado)" \
            "" \
            "- **Application ID:** \`com.whatsapprepeater.android\`" \
            "- **Versión:** \`${VERSION_NAME}\` (\`versionCode=${VERSION_CODE}\`)" \
            "- **Archivo APK:** \`${APK_NAME}\`" \
            "- **SHA-256 del APK:** \`${SHA256}\`" \
            "- **Certificado de firma (SHA-256):** \`${CERT_SHA256}\`" \
            "- **Commit:** \`${{ github.sha }}\`" \
            "" \
            "Compilado y firmado exclusivamente con el keystore permanente de producción. Mantiene compatibilidad de actualización en sitio conservando tus datos locales." \
            > "$OUT_DIR/release-notes-release.md"

          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Subir APK Release firmado como artefacto de verificación
        if: success() && steps.ver.outputs.should_publish == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: WhatsAppRepeater-release-signed
          path: |
            dist/${{ steps.verify.outputs.apk_name }}
            dist/${{ steps.verify.outputs.apk_name }}.sha256
            dist/version-metadata.json
          if-no-files-found: error

      - name: Publicar versión Release firmada en GitHub Releases
        if: success() && steps.ver.outputs.should_publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.release_tag }}
          name: "WhatsApp Repeater v${{ steps.ver.outputs.version_name }}"
          prerelease: ${{ steps.ver.outputs.is_prerelease == 'true' }}
          draft: false
          target_commitish: ${{ github.sha }}
          body_path: dist/release-notes-release.md
          files: |
            dist/${{ steps.verify.outputs.apk_name }}
            dist/${{ steps.verify.outputs.apk_name }}.sha256
            dist/version-metadata.json
